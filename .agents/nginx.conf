worker_processes 1;
pid storage/app/orb/nginx.pid;
error_log stderr;

events {
    worker_connections 256;
}

http {
    access_log off;
    client_body_temp_path storage/app/orb/body;
    proxy_temp_path storage/app/orb/proxy;
    fastcgi_temp_path storage/app/orb/fastcgi;
    uwsgi_temp_path storage/app/orb/uwsgi;
    scgi_temp_path storage/app/orb/scgi;

    server {
        listen 8080;
        client_max_body_size 140m;

        location = /orb-health {
            return 200 'ok';
        }

        # Keep the exact URI and public Host intact for S3 signature validation.
        # A single browser origin avoids authenticated-portal CORS preflights.
        location ~ ^/christmas-photos(?:/|$) {
            proxy_pass http://127.0.0.1:8333;
            proxy_set_header Host $http_host;
            proxy_request_buffering off;
            proxy_buffering off;
        }

        location / {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $http_host;
        }
    }
}
